<div class="staff-chat-panel glass-panel collapsed" id="staffChatPanel">
    <!-- iOS Grab Handle for Mobile Bottom Sheet -->
    <div class="mobile-sheet-grab-handle hide-desktop" id="chatSheetGrabHandle" aria-label="Tarik atau ketuk untuk menutup">
      <span class="grab-bar"></span>
    </div>
    <!-- Active Dispatchers Slide-down Panel -->
    <div class="chat-online-panel glass-panel" id="chatOnlinePanel" style="display: none;">
      <div class="online-panel-header">
        <span>Petugas Aktif (4)</span>
        <button id="btnCloseOnlinePanel" type="button" aria-label="Tutup panel">&times;</button>
      </div>
      <div class="online-dispatchers-list">
        <div class="dispatcher-item">
          <div class="dispatcher-avatar" style="background: linear-gradient(135deg, var(--primary-2), var(--primary));">Z</div>
          <div class="dispatcher-info">
            <strong>Zaki (Anda)</strong>
            <small>Operator Dashboard</small>
          </div>
          <span class="status-indicator online"></span>
        </div>
        <div class="dispatcher-item">
          <div class="dispatcher-avatar" style="background: linear-gradient(135deg, #10b981, #059669)">R</div>
          <div class="dispatcher-info">
            <strong>Rian (Dishub)</strong>
            <small>Korlap Ahmad Yani</small>
          </div>
          <span class="status-indicator online"></span>
        </div>
        <div class="dispatcher-item">
          <div class="dispatcher-avatar" style="background: linear-gradient(135deg, #cc8423, #a16207)">B</div>
          <div class="dispatcher-info">
            <strong>Budi (Dishub)</strong>
            <small>Patroli Wonokromo</small>
          </div>
          <span class="status-indicator online"></span>
        </div>
        <div class="dispatcher-item">
          <div class="dispatcher-avatar" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9)">S</div>
          <div class="dispatcher-info">
            <strong>SITS Bot</strong>
            <small>AI Traffic Copilot</small>
          </div>
          <span class="status-indicator online pulsing"></span>
        </div>
      </div>
    </div>

    <div class="chat-header" id="staffChatHeader">
      <div class="chat-header-title">
        <span class="chat-header-icon">💬</span>
        <div style="display: flex; flex-direction: column;">
          <strong style="font-size: 11.5px; font-weight: 800; color: var(--text); letter-spacing: -0.01em;">Koordinasi Petugas SITS</strong>
          <div class="chat-status-meta" id="chatStatusMeta" style="display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--success); font-weight: 700; margin-top: 1px; cursor: pointer;">
            <span class="chat-online-dot"></span>
            <small>4 Dispatcher Online</small>
          </div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px;">
        <button class="chat-sound-toggle-btn" id="btnToggleChatSound" type="button" title="Mute/Unmute Chat Sounds">🔊</button>
        <button class="chat-toggle-btn" id="btnToggleChatPanel" type="button">＋</button>
      </div>
    </div>
    
    <div class="chat-body" id="staffChatBody">
      <!-- Chat bubbles populated dynamically via script.js -->
    </div>
    
    <!-- Quick reply suggestions -->
    <div class="chat-quick-suggestions" id="chatQuickSuggestions">
      <button class="quick-chip" type="button" data-msg="Kirim Petugas Satlantas ke Simpang Wonokromo sekarang.">🚔 Kirim Petugas Satlantas</button>
      <button class="quick-chip" type="button" data-msg="Aktifkan Sirine Persimpangan untuk clearance lajur darurat.">🔊 Aktifkan Sirine Persimpangan</button>
      <button class="quick-chip" type="button" data-msg="Pohon Tumbang Teratasi, lalu lintas dinormalkan kembali.">🌳 Pohon Tumbang Teratasi</button>
      <button class="quick-chip" type="button" data-msg="Prioritas Ambulans 112: Berikan Green Wave Waru ke Soetomo.">🚨 Prioritas Ambulans 112</button>
      <button class="quick-chip" type="button" data-msg="Prioritaskan siklus hijau (preemption) Simpang Wonokromo.">🚦 Hijau Wonokromo</button>
    </div>

    <!-- Typing Indicator -->
    <div class="chat-typing-wrapper is-hidden" id="chatTypingWrapper">
      <div class="typing-initials">R</div>
      <div class="chat-typing-indicator">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
      <span class="typing-label">Rian sedang mengetik...</span>
    </div>
    <div class="chat-footer">
      <button class="chat-attachment-btn" id="btnChatAttach" type="button" title="Kirim Snapshot CCTV/Radar" aria-label="Kirim file">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
          <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-3.31 2.69-6 6-6s6 2.69 6 6v10c0 4.42-3.58 8-8 8s-8-3.58-8-8V5h2v10c0 3.31 2.69 6 6 6s6-2.69 6-6V5c0-2.21-1.79-4-4-4s-4 1.79-4 4v12.5c0 1.1.9 2 2 2s2-.9 2-2V6h2z"></path>
        </svg>
      </button>
      <input type="text" id="chatInputText" placeholder="Ketik koordinasi..." autocomplete="off" />
      <button class="chat-send-btn" id="btnSendChat" type="button" aria-label="Kirim pesan">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </div>
  </div>
