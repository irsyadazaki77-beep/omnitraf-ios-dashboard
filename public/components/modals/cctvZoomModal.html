<div class="modal-overlay" id="cctvZoomModal" role="dialog" aria-modal="true" aria-labelledby="zoomModalTitle" style="display: none;">
    <div class="modal-content glass-panel" style="max-width: 720px; width: 92%;">
      <button class="modal-close" id="closeCctvZoomModal" type="button" aria-label="Tutup visualisasi kamera">&times;</button>
      <div class="modal-header">
        <h2 id="zoomModalTitle" style="margin: 0; font-size: 15px; font-weight: 700;">Visualisasi Kamera Simulasi</h2>
        <p id="zoomModalDesc" style="margin: 4px 0 0 0; font-size: 12px; color: var(--text-muted);">Deteksi kendaraan sintetis untuk demonstrasi, bukan feed CCTV atau analitik lapangan.</p>
      </div>
      <div class="modal-body" style="position: relative; display: flex; justify-content: center; align-items: center; padding: 12px 0 0 0;">
        <div class="zoom-cctv-container" style="position: relative; width: 100%; max-width: 680px; aspect-ratio: 16 / 9; background: #090d16; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border);">
          <canvas id="cctvZoomCanvas" width="640" height="360" style="width: 100%; height: 100%; display: block;"></canvas>
        </div>
      </div>
    </div>
  </div>
