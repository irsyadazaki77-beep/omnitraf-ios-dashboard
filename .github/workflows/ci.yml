name: OmniTRAF CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnitraf_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: omnitraf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnitraf_test -d omnitraf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality Lint Check
        run: npm run lint

      - name: Build Production Frontend
        run: npm run build

      - name: Validate Production Build and PWA
        run: npm run validate

      - name: Execute Automated Testing Suite
        run: npm test

      - name: Execute PostgreSQL Integration Tests
        env:
          DB_DRIVER: postgres
          REQUIRE_POSTGRES_TESTS: 'true'
          DATABASE_URL: postgresql://omnitraf_test:test_only_password@localhost:5432/omnitraf_test
        run: npm run test:postgres

      - name: Execute Redis and PostgreSQL Cluster Tests
        env:
          DATABASE_URL: postgresql://omnitraf_test:test_only_password@localhost:5432/omnitraf_test
          REDIS_URL: redis://localhost:6379
          REQUIRE_CLUSTER_TESTS: 'true'
        run: npm run test:cluster
