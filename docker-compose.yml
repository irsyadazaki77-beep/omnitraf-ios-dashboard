version: '3.8'

services:
  omnitraf-app:
    container_name: omnitraf-command-center
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DB_PATH=/usr/src/app/data/omnitraf.sqlite
    volumes:
      - omnitraf-data:/usr/src/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnitraf}
      POSTGRES_USER: ${POSTGRES_USER:-omnitraf}
      # Local development credential only. Set POSTGRES_PASSWORD via .env; never reuse in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnitraf-local-dev-only}
    volumes:
      - omnitraf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  omnitraf-data:
  omnitraf-postgres-data:
