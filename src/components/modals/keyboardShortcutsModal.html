<div class="modal-overlay" id="keyboardShortcutsModal" role="dialog" aria-modal="true" aria-labelledby="shortcutsTitle">
    <div class="modal-content glass-panel" style="max-width: 400px;">
      <button class="modal-close" id="closeShortcutsModal">&times;</button>
      <div id="shortcutsTitle" class="modal-header">
        <h2 style="margin:0;">Pintasan Keyboard (Shortcuts)</h2>
        <p>Gunakan pintasan keyboard untuk mengendalikan Command Center secara cepat.</p>
      </div>
      <div class="modal-body" style="font-size: 12.5px; display: grid; gap: 8px; text-align: left;">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 4px;">
          <span>Mode Keos (Toggle)</span>
          <kbd style="background: var(--panel-soft); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-family: monospace;">K</kbd>
        </div>
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 4px;">
          <span>Bantuan Quick Tour</span>
          <kbd style="background: var(--panel-soft); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-family: monospace;">T</kbd>
        </div>
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 4px;">
          <span>Buka Peta Kota</span>
          <kbd style="background: var(--panel-soft); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-family: monospace;">M</kbd>
        </div>
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 4px;">
          <span>Buka Dashboard</span>
          <kbd style="background: var(--panel-soft); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-family: monospace;">D</kbd>
        </div>
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 4px;">
          <span>Refresh Telemetri</span>
          <kbd style="background: var(--panel-soft); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-family: monospace;">R</kbd>
        </div>
      </div>
    </div>
  </div>

  <!-- Backdrop for Mobile Staff Chat Bottom Sheet -->
  <div class="chat-sheet-backdrop" id="chatSheetBackdrop"></div>
